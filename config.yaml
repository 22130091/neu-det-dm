
seed: 42
num_classes: 120
img_size: 224
resize_size: 256
batch_size: 32
val_ratio: 0.15

imagenet_mean: [0.485, 0.456, 0.406]
imagenet_std: [0.229, 0.224, 0.225]

kaggle_dataset: "miljan/stanford-dogs-dataset-traintest"
run_checks: true

data:
  train_dir: "data/train"  
  val_dir: "data/val"      
  test_dir: "data/test"    

weights:
  resnet50: "weights/resnet50.pth"
  efficientnet_b0: "weights/efficientnet_b0.pth"
  swin_tiny: "weights/swin_tiny_best.pth"

output_dir: "evaluate_results"